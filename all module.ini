#hostname = gs-loc.apple.com, gs-loc-cn.apple.com, bluedot.is.autonavi.com
iOS Location Spoofer = type=http-response,pattern=^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc(?:\?.*)?$,requires-body=1,binary-body-mode=1,max-size=1048576,timeout=10,script-path=https://raw.githubusercontent.com/yheiakadylan/locketgold_pre/refs/heads/main/js/location-spoofer.js,argument=mode=response&latitude=40.7128&longitude=-74.0060&horizontalAccuracy=39&verticalAccuracy=1000&altitude=10&debug=false
[Map Local]
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad data-type=text data="" status-code=200

[MITM]
